services:
  db:
    ports: !reset []

  web:
    ports: !reset []
    expose:
      - "5000"
    environment:
      COOKIE_SECURE: "1"

  nginx:
    image: nginx:1.27
    depends_on:
      - web
    ports:
      - "127.0.0.1:443:443"
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
